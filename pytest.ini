[pytest]
# Pytest configuration for AI Agent Starter

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --cov
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (when using pytest-cov)
# Run with: pytest --cov
[coverage:run]
source = .
omit = 
    */venv/*
    */tests/*
    */__pycache__/*

[coverage:report]
precision = 2
skip_covered = False
show_missing = True

